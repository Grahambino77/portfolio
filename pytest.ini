[pytest]
# ---------------------------------------------------------------------------
# Default options — applied to every `python -m pytest` invocation.
# ---------------------------------------------------------------------------
addopts =
    -v
    --html=reports/report.html
    --self-contained-html
    --tracing=retain-on-failure
    --output=test-results

# Suppress noisy Playwright deprecation warnings
filterwarnings =
    ignore::DeprecationWarning
